name: task-tracker-dev

services:
  postgresql:
    image: postgres:16
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: task-tracker
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: password
    volumes:
      - task_tracker_postgres_dev_data:/var/lib/postgresql/data

volumes:
  task_tracker_postgres_dev_data:
    name: task_tracker_postgres_dev_data