name: task-tracker-prod

services:
  postgresql:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME must be set}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME must be set}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - task_tracker_postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      retries: 10
      start_period: 10s

  backend:
    image: pnrplahaed/task-tracker-backend:latest
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgresql
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:?DB_NAME must be set}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME must be set}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set}
    depends_on:
      postgresql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./logs/backend:/app/logs

  frontend:
    image: pnrplahaed/task-tracker-frontend:latest
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started

  email-sender:
    image: pnrplahaed/task-tracker-email-sender:latest
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM must be set}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST must be set}
      SMTP_PORT: ${SMTP_PORT:?SMTP_PORT must be set}
      SMTP_USERNAME: ${SMTP_USERNAME:?SMTP_USERNAME must be set}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD must be set}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  scheduler:
    image: pnrplahaed/task-tracker-scheduler:latest
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      BACKEND_URL: http://backend:8080
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
      backend:
        condition: service_started

  summarization:
    image: pnrplahaed/task-tracker-summarization:latest
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      LLM_AUTHORIZATION_KEY: ${LLM_AUTHORIZATION_KEY:?LLM_AUTHORIZATION_KEY must be set}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  kafka:
    image: apache/kafka:4.2.0
    restart: unless-stopped

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      CLUSTER_ID: Mk3OEYBSD34fcwNTJENDM2Qk

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_LOG_DIRS: /var/lib/kafka/data

    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    volumes:
      - kafka_prod_data:/var/lib/kafka/data

volumes:
  task_tracker_postgres_prod_data:
    name: task_tracker_postgres_prod_data
  kafka_prod_data:
    name: task_tracker_kafka_prod_data